version: 2

project_name: fate

before:
  hooks:
    - go mod tidy

builds:
  - id: fate
    main: ./cmd/console
    binary: fate
    env:
      # The sqlite driver (github.com/sqlite3ent/sqlite3 -> modernc.org/sqlite)
      # is pure Go. Enabling CGO makes GoReleaser cross-compile runtime/cgo for
      # linux/arm64 on the x86 ubuntu-latest runner, which fails with assembler
      # errors (gcc_arm64.S: "no such instruction: stp ..."). Keep CGO off for
      # every release target. Verified with CGO_ENABLED=0 builds for all 5 GOOS/
      # GOARCH pairs in .goreleaser.yml.
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}-
      {{- .Os }}-
      {{- .Arch }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  # GoReleaser's default `git` implementation requires a reachable previous
  # tag. This repository's tag history is divergent (only the current tag sits
  # on main), so it emitted the entire 993-commit history as release notes.
  # GitHub's release-notes generation API builds notes from merged PRs and has
  # no previous-tag requirement. Verified for v4.3.0: 287 chars, clean.
  use: github-native

release:
  github:
    owner: babyname
    name: fate
  draft: false
  prerelease: auto
