name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare-db:
    runs-on: ubuntu-latest
    outputs:
      db_changed: ${{ steps.check-db-changes.outputs.db_changed }}
      db_version: ${{ steps.determine-db-version.outputs.db_version }}
      db_gz_name: ${{ steps.determine-db-version.outputs.db_gz_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get version from tag
        id: get-version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Determine if database has changed
        id: check-db-changes
        run: |
          if git rev-list --count HEAD > /dev/null 2>&1 && [ "$(git rev-list --count HEAD)" -gt 1 ]; then
            PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Checking changes between $PREVIOUS_TAG and HEAD..."
              DB_FILES=$(git diff --name-only "$PREVIOUS_TAG" HEAD -- resources/character.json cmd/dbinit/ DB_VERSION 2>/dev/null | head -1)
              
              if [ -n "$DB_FILES" ]; then
                echo "Database-related files changed!"
                echo "db_changed=true" >> $GITHUB_OUTPUT
              else
                echo "No database-related files changed."
                echo "db_changed=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "No previous tag found, treating as changed."
              echo "db_changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "First release, treating as changed."
            echo "db_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine database version
        id: determine-db-version
        run: |
          if [ -f DB_VERSION ]; then
            DB_VER=$(cat DB_VERSION)
          else
            DB_VER="${{ steps.get-version.outputs.version }}"
          fi
          echo "db_version=$DB_VER" >> $GITHUB_OUTPUT
          echo "db_gz_name=fate-db-v${DB_VER}.db.gz" >> $GITHUB_OUTPUT
          echo "Using database version: $DB_VER"

      - name: Build dbinit tool
        if: steps.check-db-changes.outputs.db_changed == 'true'
        run: go build -o dbinit ./cmd/dbinit/

      - name: Generate database
        if: steps.check-db-changes.outputs.db_changed == 'true'
        run: ./dbinit

      - name: Prepare database artifacts
        if: steps.check-db-changes.outputs.db_changed == 'true'
        run: |
          mkdir -p releases
          cp fate.db.gz "releases/${{ steps.determine-db-version.outputs.db_gz_name }}"
          cp fate.db.gz "releases/fate.db.gz"
          cd releases
          sha256sum "${{ steps.determine-db-version.outputs.db_gz_name }}" > "${{ steps.determine-db-version.outputs.db_gz_name }}.sha256"
          sha256sum "fate.db.gz" > "fate.db.gz.sha256"
          echo "Generated artifacts:"
          ls -la

      - name: Upload database artifacts
        if: steps.check-db-changes.outputs.db_changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: db-release
          path: releases/

  release:
    needs: prepare-db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get version from tag
        id: get-version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download database artifacts
        if: needs.prepare-db.outputs.db_changed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: db-release
          path: releases/

      - name: Attach database to release (if changed)
        if: needs.prepare-db.outputs.db_changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          files: |
            releases/${{ needs.prepare-db.outputs.db_gz_name }}
            releases/${{ needs.prepare-db.outputs.db_gz_name }}.sha256
            releases/fate.db.gz
            releases/fate.db.gz.sha256
          fail_on_unmatched_files: false
